name: Generate Contribution Snake

on:
  # every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # lets you run it by hand from the Actions tab
  workflow_dispatch:
  # and on every push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG (black snake, grey squares)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-white.svg?color_snake=%23111111&color_dots=%23f0f0f0,%23d6d6d6,%23a6a6a6,%236e6e6e,%23333333

      - name: Add a white background
        run: |
          sed -i -E '0,/<svg[^>]*>/s//&<rect width="100%" height="100%" fill="#ffffff"\/>/' dist/github-snake-white.svg

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
